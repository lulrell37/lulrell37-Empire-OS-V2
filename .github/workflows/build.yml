# Builds on every push to main. Server-only / docs-only pushes are skipped —
# the backend ships from Replit, not the APK. Still runnable by hand from the
# Actions tab ("Run workflow") or: gh workflow run build.yml
name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: yarn install --network-timeout 300000
      - run: eas build --platform android --profile preview --non-interactive --no-wait
