# Manual only. Pushing/merging to main does NOT build — the whole point is to
# batch work and spend one EAS build per "push everything", on demand. Trigger
# from the Actions tab ("Run workflow") or: gh workflow run build.yml
name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: yarn install --network-timeout 300000
      - run: eas build --platform android --profile preview --non-interactive --no-wait
