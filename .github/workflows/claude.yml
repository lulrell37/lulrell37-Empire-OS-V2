# Runs the real Claude Code agent in CI when JARVIS (the Empire OS app) files an
# issue, or when Mr. Burrus answers a follow-up question as an issue comment.
# The app always puts "@claude" in the body; the action's default trigger phrase
# picks it up, implements the change on a branch, opens a PR, and comments back.
# The app polls the issue/PR and JARVIS relays questions + the "merged & pushed"
# status. Merges are done from the app after Mr. Burrus confirms.
#
# Required repo setup (one time):
#   - Secret ANTHROPIC_API_KEY  (Settings > Secrets and variables > Actions)
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests" enabled.
name: Claude Code
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model / turn limit are tunable here, e.g.:
          # claude_args: |
          #   --max-turns 20
